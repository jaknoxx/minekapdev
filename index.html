<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Professional PvP Tier List for Minecraft Combat Gamemodes">
    <meta name="theme-color" content="#0a0c15">
    <title>PvP Tier List | Combat Rankings</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="cursor-glow"></div>
<div class="bg-particles" id="particles"></div>

<header class="header">
    <div class="container">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">⚔️</div>
                <div>
                    <h1>PvP <span class="gradient-text">TIER LIST</span></h1>
                    <p class="logo-sub">Combat Rankings System</p>
                </div>
            </div>
            <a href="https://dsc.gg/minekap" class="discord-btn" target="_blank">
                <i class="fab fa-discord"></i>
                <span>Join Discord</span>
            </a>
        </div>
    </div>
</header>

<main>
    <div class="container">
        <!-- Kit Navigation -->
        <div class="nav-wrapper">
            <div class="nav-tabs" id="kitTabs"></div>
            <div class="nav-indicator"></div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Total Players</span>
                    <span class="stat-value" id="totalPlayers">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-crown"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Top Player</span>
                    <span class="stat-value" id="topPlayerName">-</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-chart-simple"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Average Points</span>
                    <span class="stat-value" id="avgPoints">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-trophy"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Highest Tier</span>
                    <span class="stat-value" id="highestTier">-</span>
                </div>
            </div>
        </div>

        <!-- Search & Filter Bar -->
        <div class="control-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search player...">
            </div>
            <div class="filter-group">
                <i class="fas fa-layer-group"></i>
                <select id="tierFilter">
                    <option value="all">All Tiers</option>
                    <option value="HT1">🔥 HT1</option>
                    <option value="LT1">⭐ LT1</option>
                    <option value="HT2">HT2</option>
                    <option value="LT2">LT2</option>
                    <option value="HT3">HT3</option>
                    <option value="LT3">LT3</option>
                    <option value="HT4">HT4</option>
                    <option value="LT4">LT4</option>
                    <option value="HT5">HT5</option>
                    <option value="LT5">LT5</option>
                </select>
            </div>
            <button class="reset-btn" id="resetBtn">
                <i class="fas fa-rotate-right"></i> Reset
            </button>
        </div>

        <!-- Players Table -->
        <div class="table-wrapper">
            <div class="table-header">
                <div class="sort-group">
                    <button class="sort-btn active" data-sort="points">
                        <i class="fas fa-chart-line"></i> Points
                    </button>
                    <button class="sort-btn" data-sort="name">
                        <i class="fas fa-sort-alpha-down"></i> Name
                    </button>
                </div>
                <div class="table-title">
                    <h2 id="tableTitle">Overall Rankings</h2>
                </div>
            </div>
            <div class="table-container">
                <table class="players-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Player</th>
                            <th>Title</th>
                            <th>Points</th>
                            <th id="kitHeader">Kit</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="5" class="loading-cell"><div class="loader"></div> Loading players...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Info Panels -->
        <div class="info-grid">
            <div class="info-card">
                <div class="info-card-header">
                    <i class="fas fa-star-of-life"></i>
                    <h3>Points System</h3>
                </div>
                <div class="points-list" id="pointsList"></div>
            </div>
            <div class="info-card">
                <div class="info-card-header">
                    <i class="fas fa-medal"></i>
                    <h3>Titles & Ranks</h3>
                </div>
                <div class="titles-list" id="titlesList"></div>
            </div>
            <div class="info-card">
                <div class="info-card-header">
                    <i class="fas fa-gamepad"></i>
                    <h3>Gamemodes</h3>
                </div>
                <div class="kits-list" id="kitsList"></div>
            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <p>© 2024 PvP Tier List | All rankings based on competitive performance</p>
    </div>
</footer>

<!-- Player Modal -->
<div class="modal" id="playerModal">
    <div class="modal-content">
        <button class="modal-close" id="closeModalBtn">
            <i class="fas fa-times"></i>
        </button>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
