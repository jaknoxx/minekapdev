<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Professional PvP Tier List for Minecraft Combat Gamemodes">
    <meta name="author" content="PvP Tier List">
    <meta name="theme-color" content="#0a0c15">
    <title>Minekap PvP Tier List | Elite Combat Rankings</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>

<!-- Background Effects -->
<div class="cursor-glow"></div>
<div class="noise-overlay"></div>
<div class="gradient-bg"></div>

<!-- Header -->
<header class="header">
    <div class="container">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-crosshairs"></i>
                </div>
                <div class="logo-text">
                    <h1>Minekap PvP <span class="gradient">TIER LIST</span></h1>
                    <p>Elite Combat Rankings</p>
                </div>
            </div>
            <div class="header-actions">
                <a href="https://dsc.gg/minekap" class="btn-discord" target="_blank">
                    <i class="fab fa-discord"></i>
                    <span>Join Discord</span>
                </a>
            </div>
        </div>
    </div>
</header>

<!-- Main Content -->
<main>
    <div class="container">
        
        <!-- Kit Navigation -->
        <div class="nav-section">
            <div class="nav-header">
                <span class="nav-label"><i class="fas fa-gamepad"></i> Gamemodes</span>
            </div>
            <div class="nav-tabs" id="kitTabs"></div>
        </div>

        <!-- Stats Dashboard -->
        <div class="stats-dashboard" id="statsDashboard">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-content">
                    <span class="stat-label">Total Players</span>
                    <span class="stat-value" id="totalPlayers">0</span>
                </div>
                <div class="stat-trend"><i class="fas fa-arrow-up"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-crown"></i></div>
                <div class="stat-content">
                    <span class="stat-label">Top Player</span>
                    <span class="stat-value" id="topPlayerName">-</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-chart-line"></i></div>
                <div class="stat-content">
                    <span class="stat-label">Average Points</span>
                    <span class="stat-value" id="avgPoints">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-trophy"></i></div>
                <div class="stat-content">
                    <span class="stat-label">Highest Tier</span>
                    <span class="stat-value" id="highestTier">-</span>
                </div>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search player by name...">
            </div>
            <div class="filter-wrapper">
                <i class="fas fa-filter"></i>
                <select id="tierFilter">
                    <option value="all">All Tiers</option>
                    <option value="HT1">🔥 HT1 - 60 pts</option>
                    <option value="LT1">⭐ LT1 - 45 pts</option>
                    <option value="HT2">HT2 - 30 pts</option>
                    <option value="LT2">LT2 - 20 pts</option>
                    <option value="HT3">HT3 - 15 pts</option>
                    <option value="LT3">LT3 - 10 pts</option>
                    <option value="HT4">HT4 - 4 pts</option>
                    <option value="LT4">LT4 - 3 pts</option>
                    <option value="HT5">HT5 - 2 pts</option>
                    <option value="LT5">LT5 - 1 pt</option>
                </select>
            </div>
            <button class="btn-reset" id="resetBtn">
                <i class="fas fa-undo-alt"></i> Reset
            </button>
        </div>

        <!-- Rankings Table -->
        <div class="table-container">
            <div class="table-header">
                <div class="table-title">
                    <i class="fas fa-list-ol"></i>
                    <h2 id="tableTitle">Overall Rankings</h2>
                </div>
                <div class="sort-buttons">
                    <button class="sort-btn active" data-sort="points">
                        <i class="fas fa-chart-simple"></i> Points
                    </button>
                    <button class="sort-btn" data-sort="name">
                        <i class="fas fa-sort-alpha-down"></i> Name
                    </button>
                </div>
            </div>
            <div class="table-wrapper">
                <table class="rankings-table">
                    <thead id="tableHeader">
                        <!-- Dynamicky se vygeneruje hlavicka podle kitu -->
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="20" class="loading-state">
                                <div class="spinner"></div>
                                <span>Loading players...</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Info Grid -->
        <div class="info-grid">
            <div class="info-card">
                <div class="card-header">
                    <i class="fas fa-star-of-life"></i>
                    <h3>Points System</h3>
                </div>
                <div class="points-grid" id="pointsList"></div>
            </div>
            <div class="info-card">
                <div class="card-header">
                    <i class="fas fa-medal"></i>
                    <h3>Titles System</h3>
                </div>
                <div class="titles-list" id="titlesList"></div>
            </div>
            <div class="info-card">
                <div class="card-header">
                    <i class="fas fa-gamepad"></i>
                    <h3>Gamemodes</h3>
                </div>
                <div class="gamemodes-list" id="gamemodesList"></div>
            </div>
        </div>
        
    </div>
</main>

<!-- Footer -->
<footer class="footer">
    <div class="container">
        <div class="footer-content">
            <p>PvP Tier List | All rankings based on competitive performance</p>
            <div class="footer-links">
                <a href="#">About</a>
                <a href="#">Rules</a>
                <a href="#">Contact</a>
            </div>
        </div>
    </div>
</footer>

<!-- Player Profile Modal -->
<div class="modal" id="playerModal">
    <div class="modal-dialog">
        <button class="modal-close" id="closeModalBtn">
            <i class="fas fa-times"></i>
        </button>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<!-- Scripts -->
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/stats.js"></script>
<script src="js/table.js"></script>
<script src="js/filters.js"></script>
<script src="js/modal.js"></script>
<script src="js/main.js"></script>
</body>
</html>
